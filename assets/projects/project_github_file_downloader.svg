<svg width="490" height="104" viewBox="0 0 490 104" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(10px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .card-wrap {
      animation: fadeInUp 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .card-border {
      transition: stroke 0.25s ease, stroke-width 0.25s ease;
    }
    .card-wrap:hover .card-border {
      stroke: #58A6FF;
      stroke-width: 1.5;
    }
  </style>

  <g class="card-wrap">
    <!-- Card Base Background (Matching My Services rect rx=12) -->
    <rect x="0.5" y="0.5" width="489" height="103" rx="12" fill="#0D1117" stroke="#30363D" stroke-width="1" class="card-border" />

    <!-- Icon Container (Matching My Services: 48x48 rx=6 fill=#161b22) -->
    <rect x="20" y="28" width="48" height="48" rx="6" fill="#161b22" />
    <g transform="translate(32, 40)">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#ffffff"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" />
  <path d="M14 2v4a2 2 0 0 0 2 2h4" />
  <path d="M12 18v-6" />
  <path d="m9 15 3 3 3-3" />
      </svg>
    </g>

    <!-- Project Title -->
    <text x="86" y="48" font-family="-apple-system, system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Github-File-Downloader</text>

    <!-- External Link Arrow Indicator -->
    <g transform="translate(456, 22)" fill="none" stroke="#8B949E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
      <path d="M 2 10 L 10 2" />
      <path d="M 4 2 L 10 2 L 10 8" />
    </g>

    <!-- Description Lines (Matching My Services font & color) -->
    <text x="86" y="70" font-family="-apple-system, system-ui, sans-serif" font-size="13" fill="#8b949e">Automated workflow that downloads web files into your repository</text>
    <text x="86" y="88" font-family="-apple-system, system-ui, sans-serif" font-size="13" fill="#8b949e">with aria2/curl, 7z compression, splitting, and AES encryption.</text>
  </g>
</svg>