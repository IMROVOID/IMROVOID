<svg width="490" height="248" viewBox="0 0 490 248" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="bannerClip">
      <path d="M 0.5 14.5 A 14 14 0 0 1 14.5 0.5 L 475.5 0.5 A 14 14 0 0 1 489.5 14.5 L 489.5 160 L 0.5 160 Z" />
    </clipPath>
    <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D1117" stop-opacity="0" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <style>
    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(10px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .card-wrap {
      animation: fadeInUp 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .card-border {
      transition: stroke 0.25s ease, stroke-width 0.25s ease;
    }
    .card-wrap:hover .card-border {
      stroke: #58A6FF;
      stroke-width: 1.5;
    }
  </style>

  <g class="card-wrap">
    <!-- Card Base Background -->
    <rect x="0.5" y="0.5" width="489" height="247" rx="14" fill="#0D1117" stroke="#30363D" stroke-width="1" class="card-border" />

    <!-- Banner Container -->
    <g clip-path="url(#bannerClip)">
      
      <rect width="490" height="160" fill="#090D13" />
      <image href="data:image/webp;base64," x="0" y="0" width="490" height="160" preserveAspectRatio="xMidYMid slice" />
        
      <!-- Gradient melt into card body -->
      <rect x="0" y="115" width="490" height="45" fill="url(#bottomFade)" />
    </g>

    <!-- Dividing Line -->
    <line x1="0" y1="160" x2="490" y2="160" stroke="#30363D" stroke-width="1" stroke-opacity="0.5" />

    <!-- Project Title -->
    <text x="20" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Freebuff2API</text>

    <!-- External Link Arrow Indicator -->
    <g transform="translate(454, 180)" fill="none" stroke="#58A6FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
      <path d="M 2 10 L 10 2" />
      <path d="M 4 2 L 10 2 L 10 8" />
    </g>

    <!-- Description Lines -->
    <text x="20" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8B949E">High-performance dual-runtime OpenAI-compatible API router</text>
    <text x="20" y="233" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8B949E">and OAuth proxy for Freebuff with multi-account pooling.</text>
  </g>
</svg>